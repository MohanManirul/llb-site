<form class="w-full max-w-4xl mx-auto my-6" enctype="multipart/form-data">

    <div class="bg-white border border-gray-200 rounded-md shadow-sm">

        <!-- Header -->
        <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200">
            <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600">
                🏢
            </div>

            <div>
                <h3 class="text-md font-semibold text-gray-800">
                    Create Business
                </h3>

                <p class="text-xs text-gray-500">
                    Manage profile, owner, dropshipping and account settings.
                </p>
            </div>
        </div>

        <div class="p-6 space-y-8">

            <!-- Logo -->
            <section>
                <div class="flex flex-col items-center text-center">

                    <label
                        class="flex items-center justify-center w-32 h-32 overflow-hidden rounded-full border-2 border-dashed border-gray-300 bg-gray-50 cursor-pointer">

                        <span class="text-gray-400 text-center">
                            📷
                            <br>
                            Upload
                        </span>

                    </label>

                    <input type="file" class="mt-4">

                    <p class="mt-3 text-xs text-gray-400">
                        PNG or JPG. Click the logo to upload.
                    </p>

                </div>
            </section>

            <!-- Basic Information -->
            <section>

                <h4
                    class="pb-2 mb-4 text-sm font-semibold tracking-wide uppercase text-gray-500 border-b border-gray-100">
                    Basic Information
                </h4>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Name
                        </label>

                        <input type="text"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring focus:ring-indigo-200">
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Owner
                        </label>

                        <select
                            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring focus:ring-indigo-200">
                            <option>Select Owner</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-1 text-sm font-medium">
                            Description
                        </label>

                        <textarea rows="3"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring focus:ring-indigo-200"></textarea>
                    </div>

                </div>

            </section>

            <!-- Dropshipping -->
            <section>

                <h4
                    class="pb-2 mb-4 text-sm font-semibold tracking-wide uppercase text-gray-500 border-b border-gray-100">
                    Dropshipping
                </h4>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Dropshipper Allowed
                        </label>

                        <select class="w-full rounded-md border border-gray-300 px-3 py-2">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Dropship Supplier
                        </label>

                        <select class="w-full rounded-md border border-gray-300 px-3 py-2">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Dropshipping COD Charge (%)
                        </label>

                        <input type="number" class="w-full rounded-md border border-gray-300 px-3 py-2">
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Dropshipping Processing Fee
                        </label>

                        <input type="number" class="w-full rounded-md border border-gray-300 px-3 py-2">
                    </div>

                </div>

            </section>

            <!-- Account Settings -->
            <section>

                <h4
                    class="pb-2 mb-4 text-sm font-semibold tracking-wide uppercase text-gray-500 border-b border-gray-100">
                    Account Settings
                </h4>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Calling Allowed
                        </label>

                        <select class="w-full rounded-md border border-gray-300 px-3 py-2">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">
                            Status
                        </label>

                        <select class="w-full rounded-md border border-gray-300 px-3 py-2">
                            <option>Active</option>
                            <option>Inactive</option>
                        </select>
                    </div>

                </div>

            </section>

        </div>

        <!-- Footer -->
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50">

            <button type="button" class="rounded-md border border-gray-300 px-5 py-2 hover:bg-gray-100">
                Cancel
            </button>

            <button type="submit" class="rounded-md bg-indigo-600 px-5 py-2 text-white hover:bg-indigo-700">
                Create Business
            </button>

        </div>

    </div>

</form>
